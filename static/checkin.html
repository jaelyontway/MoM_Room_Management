<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check In – Spa</title>
    <link rel="stylesheet" href="/static/checkin.css">
</head>
<body>
    <div id="kiosk" class="kiosk">
        <div class="camera-wrap">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <div id="screenIdle" class="screen screen-idle">
            <p class="message">Waiting for you…</p>
            <div class="face face-idle" aria-hidden="true">
                <svg class="face-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <circle class="face-head" cx="60" cy="60" r="55" fill="#ffdbac" stroke="#e0b080"/>
                    <circle class="face-eye" cx="42" cy="52" r="6" fill="#333"/>
                    <circle class="face-eye" cx="78" cy="52" r="6" fill="#333"/>
                    <path id="mouthIdle" class="face-mouth" d="M 35 75 Q 60 88 85 75" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
            <button type="button" id="startCheckinBtn" class="btn-start-checkin">Tap to start check-in</button>
        </div>

        <div id="screenCheckin" class="screen screen-checkin" style="display:none;">
            <p class="message" id="checkinPrompt">Please check in for your appointment</p>
            <div id="faceCheckin" class="face face-smiley" aria-hidden="true">
                <svg class="face-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <circle class="face-head" cx="60" cy="60" r="55" fill="#ffdbac" stroke="#e0b080"/>
                    <circle class="face-eye" cx="42" cy="52" r="6" fill="#333"/>
                    <circle class="face-eye" cx="78" cy="52" r="6" fill="#333"/>
                    <path class="face-mouth face-mouth-talk" d="M 40 72 Q 60 90 80 72" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
            <p class="voice-hint" id="voiceHint">Speak your name, or type below.</p>
            <form id="checkinForm" class="checkin-form">
                <label for="guestName">Your name (if not using voice)</label>
                <input type="text" id="guestName" name="name" placeholder="Your name" autocomplete="name">
                <label for="guestMinutes">Minutes (if not using voice)</label>
                <select id="guestMinutes" name="minutes">
                    <option value="">Select minutes</option>
                    <option value="30">30 minutes</option>
                    <option value="60">60 minutes</option>
                    <option value="90">90 minutes</option>
                    <option value="120">120 minutes</option>
                </select>
                <button type="submit" class="btn-checkin">Check in</button>
            </form>
        </div>

        <div id="screenWelcome" class="screen screen-welcome" style="display:none;">
            <p class="message welcome-msg"></p>
            <div id="faceWelcome" class="face face-smiley" aria-hidden="true">
                <svg class="face-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <circle class="face-head" cx="60" cy="60" r="55" fill="#ffdbac" stroke="#e0b080"/>
                    <circle class="face-eye" cx="42" cy="52" r="6" fill="#333"/>
                    <circle class="face-eye" cx="78" cy="52" r="6" fill="#333"/>
                    <path class="face-mouth face-mouth-talk" d="M 40 72 Q 60 90 80 72" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
            <p class="submsg">Please have a seat. Someone will be out shortly to help you.</p>
            <button type="button" id="btnNext" class="btn-next">Check in next person</button>
        </div>

        <div id="screenError" class="screen screen-error" style="display:none;">
            <p class="message">We couldn't find an appointment under that name today.</p>
            <p class="submsg">Please see the front desk.</p>
            <button type="button" id="btnTryAgain" class="btn-next">Try again</button>
        </div>
    </div>
    <script src="/static/checkin.js"></script>
    <script>
        (function () {
            const startBtn = document.getElementById('startCheckinBtn');
            const screenIdle = document.getElementById('screenIdle');
            const screenCheckin = document.getElementById('screenCheckin');
            const guestNameInput = document.getElementById('guestName');
            if (!startBtn || !screenIdle || !screenCheckin) return;
            startBtn.addEventListener('click', function () {
                screenIdle.style.display = 'none';
                screenCheckin.style.display = 'block';
                if (guestNameInput) {
                    try { guestNameInput.focus(); } catch (e) {}
                }
            });
        })();
    </script>
</body>
</html>
