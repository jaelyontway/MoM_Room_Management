services:
  mom-room-jaelyn:
    build: .
    container_name: mom-room-jaelyn
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      # 数据库放在容器外，重建容器数据不丢
      - ./room_assignments.db:/srv/app/room_assignments.db

    # ── 重启策略（restart policy）──
    # 崩溃自动重启；电脑重启后 Docker 启动时自动拉起；
    # 只有手动 stop 才会停。
    restart: unless-stopped

    # ── 健康检查（healthcheck policy）──
    # 每 30 秒访问一次 /api/status，连续 3 次失败就标记为 unhealthy。
    # 用 docker ps 可以直接看到 healthy / unhealthy 状态。
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/status', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # ── 资源限制（resource policy）──
    # 最多用 1 个 CPU 核、512MB 内存，防止程序失控拖垮整台电脑。
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

    # ── 日志策略（logging policy）──
    # 日志自动轮转：单文件最大 10MB，最多留 3 个，永远不会撑爆硬盘。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
